version: "3.9"

networks:
  univ-network:
    driver: bridge

volumes:
  pgdata:
  grafana-data:
  prometheus-data:

services:
  postgres:
    image: postgres
    container_name: univ-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: univapptwopointone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - univ-network

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: univ-pgbouncer
    depends_on:
      - postgres
    ports:
      - "6432:6432"
    volumes:
      - ./db/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./db/userlist.txt:/etc/pgbouncer/userlist.txt
    networks:
      - univ-network

  prometheus:
    image: prom/prometheus:latest
    container_name: univ-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - univ-network

  grafana:
    image: grafana/grafana:latest
    container_name: univ-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - univ-network
    depends_on:
      - prometheus
